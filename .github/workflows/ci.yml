name: Test and build
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Select Xcode with macOS 26 SDK
        shell: zsh {0}
        run: |
          for candidate in /Applications/Xcode*.app; do
            sdk=$(DEVELOPER_DIR="$candidate/Contents/Developer" xcrun --sdk macosx --show-sdk-version 2>/dev/null) || continue
            if [[ ${sdk%%.*} -ge 26 ]]; then
              print -r -- "DEVELOPER_DIR=$candidate/Contents/Developer" >> "$GITHUB_ENV"
              exit 0
            fi
          done
          print -u2 'The CoreHID diagnostic target requires Xcode with macOS 26 SDK.'
          exit 1
      - run: ./Scripts/audit-source.sh
      - run: ./Scripts/test.sh
      - run: ./Scripts/build-app.sh
